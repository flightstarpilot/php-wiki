name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null; then
              echo "Syntax error in $file"
              fail=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          exit $fail

      - name: Check for emoji in source
        run: |
          set -e
          if grep -P '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' -r src templates lang *.php 2>/dev/null; then
            echo "Emoji detected in source files."
            exit 1
          fi
